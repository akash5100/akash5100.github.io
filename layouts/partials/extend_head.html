{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
{{- end }}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        {{- if or .Params.math .Site.Params.math }}
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });
        {{- end }}

        document.querySelectorAll('a[href]').forEach((a) => {
            if (a.hostname && a.hostname !== window.location.hostname) {
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            }
        });
    });
</script>

<style>
/* Code block horizontal scroll (no-wrap by default) */
.highlight pre,
pre {
    overflow-x: auto !important;
}
.highlight pre code,
.highlight .chroma .cl,
pre code {
    white-space: pre !important;
    word-break: normal !important;
}
.highlight:not(.is-wrapped) .chroma .cl {
    flex-shrink: 0 !important;
}

/* Code block wrapped state */
.highlight.is-wrapped pre code,
.highlight.is-wrapped .chroma .cl,
pre.is-wrapped code {
    white-space: pre-wrap !important;
    word-break: break-word !important;
}
.highlight.is-wrapped .chroma .line {
    flex-wrap: wrap !important;
}
.highlight.is-wrapped .chroma .cl {
    min-width: 0 !important;
}

/* Wrap toggle button position (inherits all styles from PaperMod's .copy-code) */
.wrap-code {
    right: 62px;
}

/* Typography */
body,
.post-content,
.post-content p,
.post-content li {
    font-size: 16px !important;
    line-height: 1.6;
}
.post-title {
    font-size: 36px !important;
}
.post-content h1 {
    font-size: 28px !important;
}
.post-content h2 {
    font-size: 24px !important;
}
.post-content h3 {
    font-size: 18px !important;
}
.post-content h4 {
    font-size: 16px !important;
}
.toc {
    font-size: 15px !important;
}
.post-content table th,
.post-content table:not(.highlighttable, .highlight table, .gist .highlight) td {
    min-width: 80px;
    padding: 6px 4px;
    line-height: 1.25;
}
.post-content table th {
    font-size: 14px;
}
.post-content a {
    transition: color 0.15s ease;
}
.post-content a:hover {
    color: #aaa !important;
}
.post-content figure > figcaption {
    font-weight: 400 !important;
    font-size: 0.9em !important;
    color: #888 !important;
}
.katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
}

/* Collapsible details callout */
.post-content details {
    margin: 1.25rem 0;
    padding: 0.75rem 1rem;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.post-content details > summary {
    cursor: pointer;
    user-select: none;
}
.post-content details[open] > summary {
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
}
.post-content details > :last-child {
    margin-bottom: 0;
}
.post-content details iframe {
    display: block;
    width: 100%;
    background: var(--theme);
    border-radius: calc(var(--radius) - 2px);
}

/* Custom scrollbar */
::-webkit-scrollbar {
    width: 19px;
    height: 11px;
}
::-webkit-scrollbar-track {
    background: 0 0;
}
.list:not(.dark)::-webkit-scrollbar-track {
    background: var(--code-bg);
}
::-webkit-scrollbar-thumb {
    background: var(--tertiary);
    border: 5px solid var(--theme);
    border-radius: var(--radius);
}
.list:not(.dark)::-webkit-scrollbar-thumb {
    border: 5px solid var(--code-bg);
}
::-webkit-scrollbar-thumb:hover {
    background: var(--secondary);
}
</style>

{{- if not hugo.IsServer }}
<script data-goatcounter="https://akash5100.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{{- end }}
